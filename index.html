<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Open GIS archive</title>
    <meta
      name="description"
      content="A small archive of experiments and apps from Open GIS."
    />
    <link
      rel="stylesheet"
      href="https://www.ogis.org/branding/assets/css/ogis.css"
    />
    <link
      rel="icon"
      href="https://www.ogis.org/branding/assets/img/logo-green.png"
    />
    <style>
      .site-brand img {
        display: block;
      }

      .ogis-band ul {
        padding-left: 1.25rem;
      }

      .ogis-band li + li {
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="site-brand" href="https://www.ogis.org/" aria-label="Open GIS">
        <img
          src="https://www.ogis.org/branding/assets/img/logo-green.png"
          alt="Open GIS"
          width="40"
          height="40"
        />
        <h1>Archive</h1>
      </a>
    </header>

    <main class="ogis-bands">
      <section class="ogis-band">
        <h2>Fun</h2>
        <ul>
          <li>
            <a href="fun/pwa/app-matrix/">App Theme Showcase</a> — Matrix Style,
            by <a href="https://github.com/rdlussier">rdlussier</a>.
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
